name: Checks
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Linux system libraries for Qt and the X11 test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool xclip libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-randr0
      - run: uv sync --extra dev
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Self-test on X11 (shortcut pressed with xdotool, PRIMARY selection with xclip)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" bash -c '
            printf "Selected on CI" | xclip -selection primary
            REDPOINT_EXPECT_SELECTION="Selected on CI" REDPOINT_TEST_PRESS="xdotool key ctrl+alt+r" \
            QT_QPA_PLATFORM=xcb uv run redpoint --self-test selftest-out'
      - name: Self-test on the native desktop (shortcut registration, rendering, IPC)
        if: runner.os != 'Linux'
        run: uv run redpoint --self-test selftest-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.os }}-${{ matrix.python }}
          path: selftest-out
          if-no-files-found: ignore
  macos-e2e:
    # Best effort: needs the runner to allow synthetic input (Accessibility). Shows how far a
    # real Mac flow gets: TextEdit selection -> Ctrl+Option+R -> Cmd+C -> reading.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Shortcut fired by System Events
        run: |
          REDPOINT_TEST_PRESS="osascript -e 'tell application \"System Events\" to keystroke \"r\" using {control down, option down}'" \
          uv run redpoint --self-test out-press
      - name: Selection copied from TextEdit
        run: |
          printf 'Selected in TextEdit on macOS' > /tmp/sample.txt
          open -a TextEdit /tmp/sample.txt
          sleep 3
          osascript -e 'tell application "TextEdit" to activate' -e 'tell application "System Events" to keystroke "a" using {command down}'
          sleep 1
          REDPOINT_EXPECT_SELECTION='Selected in TextEdit on macOS' uv run redpoint --self-test out-selection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-e2e
          path: out-*
